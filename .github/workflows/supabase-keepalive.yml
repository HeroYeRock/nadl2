# Supabase 무료 플랜은 일정 기간 요청이 없으면 프로젝트를 자동 일시정지한다.
# 3일마다 DB 를 거치는 가벼운 REST 요청을 보내 깨어 있게 유지한다.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *" # 3일마다 03:17 UTC (12:17 KST)
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 저장소 시크릿이 없습니다."
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/place_popularity?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          head -c 300 /tmp/body; echo
          if [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            echo "::error::Supabase 응답 실패 (일시정지/삭제 여부를 대시보드에서 확인하세요)"
            exit 1
          fi
